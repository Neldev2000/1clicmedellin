# Dirección legal de la empresa. Ejemplo: Calle 10 # 43-25, Medellín
direccion =

[telefonos]
# ► NÚMERO PRINCIPAL: se usa en TODO el sitio (WhatsApp, llamadas y línea de
#   atención). Para cambiar el número en todas partes, cambia solo esta línea.
#   Se acepta +57 311 866 6709, 3118666709 o +573118666709.
principal = +57 311 866 6709

# Llena estas solo si alguna debe ser DISTINTA del principal (vacías = principal):
whatsapp =
celular =
# Si consiguen una línea 01 8000 XXX XXX, escríbela aquí: el sitio dejará de decir
# "línea de atención" y dirá "línea gratuita" (nunca se llama gratuita a un celular).
linea_atencion =

[correos]
# Puedes usar el mismo correo para todo o uno distinto por tema.
