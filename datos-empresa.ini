# =============================================================================
#  1clic · DATOS DE LA EMPRESA Y CANALES DE CONTACTO
#
#  Este es el ÚNICO lugar donde se cambian. Después de guardar:
#    · con la vista previa abierta (python3 1clic-web/tools/servidor_local.py)
#      basta con recargar el navegador: los cambios se aplican solos;
#    · o ejecuta:  python3 1clic-web/tools/aplicar_datos.py
#
#  El programa copia estos datos a config.js, a las 13 páginas (también a la
#  versión que se ve sin JavaScript) y a los datos estructurados para Google.
#
#  Cómo escribir:
#    · El valor va después del "=". Sin comillas.
#    · Deja vacío lo que aún no tengas: el sitio mostrará [•] (pendiente).
#    · Las líneas que empiezan con # son comentarios y no se publican.
# =============================================================================

[empresa]
